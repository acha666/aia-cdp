# pnpm settings for this single-package repo (pnpm 10 reads them here, not from .npmrc).
# After changing this file, delete node_modules and reinstall: hoisting changes only apply to a fresh install.

# Install scripts are not needed and are blocked by pnpm 10; listing them silences the
# "Ignored build scripts" notice. wrangler types, deploy --dry-run, wrangler dev and
# getPlatformProxy work without the esbuild / workerd postinstalls; vue-demi (via
# @tanstack/vue-query) already ships its Vue 3 build as the default.
ignoredBuiltDependencies:
  - esbuild
  - workerd
  - vue-demi

# vue-eslint-parser require()s the "newest" espree / eslint-scope it can find from process.cwd().
# Without a copy at the project root, Debian's patched nodejs also searches /usr/share/nodejs,
# whose node-espree / node-eslint-scope report version "main" -> "Parsing error: Invalid Version: main"
# on every .vue file.
publicHoistPattern:
  - espree
  - eslint-scope
