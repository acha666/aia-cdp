<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_SITE_NAME%</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!--
      The dark class before the first paint, by the rule ThemeToggle.vue's useColorMode applies
      after mount (same key and values): no flash of the light theme. Keep it byte-stable: the
      CSP allows this script by its sha256.
    -->
    <script>
      try {
        const theme = localStorage.getItem("theme-preference");
        if (
          theme === "dark" ||
          ((theme === null || theme === "auto") &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
